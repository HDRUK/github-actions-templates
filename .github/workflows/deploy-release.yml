name: Deploy Release

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      tag_version:
        required: false
        type: string
      run_scan:
        description: "Enable AppCheck scan"
        required: false
        type: boolean
        default: false
      chart_path:
        required: true
        type: string
      git_ref:
        required: true
        type: string
        default: "main"
      docker_project_id:
        required: false
        type: string

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v3"
        with:
          token_format: "access_token"
          project_id: "${{ secrets.PROJECT_ID }}"
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      - name: Resolve image tag
        id: resolve_tag
        run: |
          if [ "${{ inputs.env }}" = "dev" ]; then
            TAG=$(awk -F'"' '/^appVersion:/ {print $2}' ${{ inputs.chart_path }})
          else
            TAG="${{ inputs.tag_version }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Resolve target project
        id: project_id
        run: |
          PROJECT="${{ inputs.docker_project_id }}"

          if [ "${{ inputs.env }}" = "dev" ] || [ -z "$PROJECT" ]; then
            PROJECT="${{ secrets.PROJECT_ID }}"
          fi
          echo "project=$PROJECT" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        uses: actions-hub/gcloud@540.0.0
        id: deploy
        env:
          PROJECT_ID: ${{ steps.project_id.outputs.project }}
          PROD_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
          GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
          GAR_NAME: ${{ secrets.GAR_NAME }}
          SERVICE_NAME: "${{ secrets.SERVICE_NAME }}"
          SERVICE_REGION: "${{ secrets.SERVICE_REGION }}"
        with:
          args: run services update '${{ env.SERVICE_NAME }}' --image='${{ env.GAR_LOCATION }}'-docker.pkg.dev/'${{ env.PROJECT_ID }}'/'${{ env.GAR_NAME }}'/${{ steps.resolve_tag.outputs.tag }}:latest --region='${{ env.SERVICE_REGION }}' --project='${{ env.PROJECT_ID }}'

      - name: Trigger AppCheck scan
        id: appcheck-scan
        if: ${{ success() && inputs.run_scan && inputs.env == 'preprod' }}
        env:
          APPCHECK_API_KEY: ${{ secrets.APPCHECK_API_KEY }}
          APPCHECK_SCAN_ID: ${{ secrets.APPCHECK_SCAN_ID }}
        shell: bash
        run: |
          set -euo pipefail
          
          if [[ -z "${APPCHECK_API_KEY:-}" || -z "${APPCHECK_SCAN_ID:-}" ]]; then
            echo "AppCheck secrets are not set. Skipping scan trigger." >&2
            exit 0
          fi
          
          BASE_URL="https://api.appcheck-ng.com/api/v1/${APPCHECK_API_KEY}/scan/${APPCHECK_SCAN_ID}"
          
          echo "Checking AppCheck scan status..."
          
          STATUS_JSON=$(curl -fsSL "${BASE_URL}/status" || true)
          # Extract the 'status' field from the response
          if command -v jq >/dev/null 2>&1; then
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status // empty' | tr '[:upper:]' '[:lower:]')
          else
            STATUS=$(echo "$STATUS_JSON" | sed -n 's/.*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | tr '[:upper:]' '[:lower:]')
          fi
          echo "Current status: ${STATUS:-unknown}"
          case "${STATUS}" in
            running|paused|detached)
              echo "Existing scan appears active (${STATUS}). Aborting before starting a new one..."
              curl -fsSL -X POST "${BASE_URL}/abort" -H "Content-Length: 0" || true
              sleep 60
              ;;
            *)
              echo "No active scan detected or status unknown; proceeding to start."
              ;;
          esac
          echo "Starting new AppCheck scan..."
          curl -fsSL -X POST "${BASE_URL}/start" -H "Content-Length: 0"