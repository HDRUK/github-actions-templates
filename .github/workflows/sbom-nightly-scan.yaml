name: SBOM nightly estate scan

# Re-scans the latest SBOM of every repository/layer/ref against a fresh Grype
# database, without rebuilding anything, and loads results into BigQuery.
# Runs in this repository. Requires repository variables:
#   SBOM_BUCKET, SBOM_BQ_DATASET (e.g. "project.sbom"),
#   SBOM_GCP_WIF_PROVIDER, SBOM_GCP_SERVICE_ACCOUNT
# Optional secret SBOM_SLACK_WEBHOOK_URL (falls back to SLACK_WEBHOOK_URL): if
# neither is set, no alert is sent.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    name: Scan latest SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLACK_WEBHOOK: ${{ secrets.SBOM_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Google Auth (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.SBOM_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.SBOM_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install Grype
        env:
          SYFT_VERSION: '1.51.1'
          GRYPE_VERSION: '0.118.0'
        run: bash scripts/sbom/install_tools.sh

      - name: Update Grype database
        run: grype db update

      # Per-SBOM failures are logged and skipped; the step still exits non-zero
      # at the end if any were skipped, so they are visible. Builds are unaffected.
      - name: Scan and load into BigQuery
        id: scan
        run: python3 scripts/sbom/cli.py nightly --bucket "${{ vars.SBOM_BUCKET }}" --dataset "${{ vars.SBOM_BQ_DATASET }}"

      - name: Notify Slack (optional)
        if: always() && env.SLACK_WEBHOOK != '' && (steps.scan.outcome == 'failure' || steps.scan.outputs.fixable_criticals != '0')
        env:
          CRITICALS: ${{ steps.scan.outputs.fixable_criticals }}
          OUTCOME: ${{ steps.scan.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="$(python3 -c 'import json,os;print(json.dumps({"text":f"SBOM nightly scan: {os.environ[\"OUTCOME\"]}, fixable critical findings: {os.environ.get(\"CRITICALS\") or \"n/a\"}. {os.environ[\"RUN_URL\"]}"}))')"
          curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK"
