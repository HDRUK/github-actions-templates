name: SBOM nightly scan

# Scans every stored SBOM against a fresh vulnerability database and loads the
# results into BigQuery for Superset. See docs/ARCHITECTURE/sbom-pipeline.md.
# Needs repository variables SBOM_BUCKET, SBOM_BQ_DATASET (project.dataset),
# SBOM_GCP_WIF_PROVIDER, SBOM_GCP_SERVICE_ACCOUNT. Slack alert only if a webhook secret is set.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLACK_WEBHOOK: ${{ secrets.SBOM_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.SBOM_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.SBOM_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: anchore/scan-action/download-grype@v7
        with:
          grype-version: v0.118.0

      - name: Scan SBOMs and load into BigQuery
        id: scan
        env:
          BUCKET: ${{ vars.SBOM_BUCKET }}
          DATASET: ${{ vars.SBOM_BQ_DATASET }}
        run: scripts/sbom/nightly.sh

      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK != '' && (steps.scan.outcome == 'failure' || steps.scan.outputs.fixable_criticals != '0')
        env:
          TEXT: "SBOM nightly scan ${{ steps.scan.outcome }}: ${{ steps.scan.outputs.fixable_criticals }} fixable critical findings. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          jq -n --arg text "$TEXT" '{text: $text}' |
            curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
