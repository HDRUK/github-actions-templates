name: Jira Fix Version Workflow

# Reusable workflow: tags Jira tickets with a release "fix version".
#
# Runs from a release branch (release/X.Y.Z). It:
#   1. Derives the fix-version name from the branch (release/1.12.0 -> 1.12.0).
#   2. Diffs the branch against the last release tag (git log <last-tag>..HEAD)
#      and extracts the Jira issue keys referenced in those commits.
#   3. For each project found: ensures the fix version exists in Jira and adds
#      it to every referenced ticket.
#
# Example caller (.github/workflows/jira-fix-version.yml):
#   on:
#     push:
#       branches: ["release/*"]
#   jobs:
#     jira:
#       uses: HDRUK/github-actions-templates/.github/workflows/jira-fix-version.yaml@main
#       with:
#         jira_projects: "DP"        # or "DP,GAT,REGISTRY"
#       secrets: inherit

on:
  workflow_call:
    inputs:
      jira_projects:
        description: "Comma-separated Jira project keys to tag (DP or DP,GAT,REGISTRY)"
        required: true
        type: string
      dry_run:
        description: "If true, only log what would change and do not write to Jira"
        required: false
        type: boolean
        default: false

jobs:
  jira-fix-version:
    name: Tag Jira fix version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + tags so we can diff against the last release tag.
          fetch-depth: 0

      - name: Extract version from branch
        id: ver
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION="${BRANCH_NAME#release/}"
            VERSION="${VERSION#v}"   # strip leading v if present
            echo "Detected release branch. Version: $VERSION"
          else
            echo "ERROR: this workflow must run on a release/* branch (got: $BRANCH_NAME)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release range
        id: range
        run: |
          BASE=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$BASE" ]; then
            RANGE="$BASE..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "Base release tag: ${BASE:-<none>}"
          echo "Commit range    : $RANGE"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Extract Jira issue keys
        id: keys
        env:
          PROJECTS: ${{ inputs.jira_projects }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          MESSAGES=$(git log $RANGE --format='%s%n%b')

          ALL=""
          IFS=',' read -ra PROJ <<< "$PROJECTS"
          for raw in "${PROJ[@]}"; do
            P=$(echo "$raw" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
            [ -z "$P" ] && continue
            FOUND=$(printf '%s\n' "$MESSAGES" | grep -oE "\b${P}-[0-9]+\b" || true)
            [ -n "$FOUND" ] && ALL="${ALL}${FOUND}"$'\n'
          done

          KEYS=$(printf '%s' "$ALL" | grep -E '.' | sort -u | tr '\n' ' ' | sed 's/ *$//' || true)
          if [ -z "$KEYS" ]; then
            echo "No matching Jira issues in $RANGE for projects: $PROJECTS"
          else
            echo "Issues to tag: $KEYS"
          fi
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"

      - name: Check Jira credentials
        if: ${{ !inputs.dry_run && steps.keys.outputs.keys != '' }}
        env:
          JIRA_CLOUD_ID: ${{ secrets.RELEASE_JIRA_CLOUD_ID }}
          JIRA_TOKEN: ${{ secrets.RELEASE_JIRA_TOKEN }}
        run: |
          # Auth is a service-account scoped tokens must be
          # sent as a Bearer header against the api.atlassian.com gateway with the cloud id in the path 
          if [ -z "${JIRA_CLOUD_ID:-}" ] || [ -z "${JIRA_TOKEN:-}" ]; then
            echo "ERROR: RELEASE_JIRA_CLOUD_ID and RELEASE_JIRA_TOKEN must be set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/jira_me -w '%{http_code}' \
            -H "Authorization: Bearer $JIRA_TOKEN" -H "Accept: application/json" \
            "https://api.atlassian.com/ex/jira/$JIRA_CLOUD_ID/rest/api/3/myself" || true)
          if [ "$code" != "200" ]; then
            echo "ERROR: Jira authentication failed (GET /myself -> HTTP $code)."
            echo "  401 = wrong/expired token, or trailing whitespace in the secret"
            echo "  404 = wrong RELEASE_JIRA_CLOUD_ID"
            echo "  secret lengths: cloud_id=${#JIRA_CLOUD_ID} token=${#JIRA_TOKEN}"
            exit 1
          fi
          echo "Jira authentication OK."

      - name: Create Jira fix versions
        if: ${{ !inputs.dry_run && steps.keys.outputs.keys != '' }}
        env:
          JIRA_CLOUD_ID: ${{ secrets.RELEASE_JIRA_CLOUD_ID }}
          JIRA_TOKEN: ${{ secrets.RELEASE_JIRA_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          KEYS: ${{ steps.keys.outputs.keys }}
        run: |
          API="https://api.atlassian.com/ex/jira/$JIRA_CLOUD_ID/rest/api/3"
          AUTH=(-H "Authorization: Bearer $JIRA_TOKEN")

          # Unique projects derived from the issue key prefixes.
          PROJECTS=$(printf '%s\n' $KEYS | sed -E 's/-[0-9]+$//' | sort -u)
          for P in $PROJECTS; do
            code=$(curl -sS -o /tmp/proj -w '%{http_code}' "${AUTH[@]}" -H "Accept: application/json" "$API/project/$P")
            if [ "$code" != "200" ]; then
              echo "[$P] GET /project/$P -> HTTP $code"
              head -c 300 /tmp/proj; echo ""
              exit 1
            fi
            PID=$(jq -r '.id' /tmp/proj)

            vcode=$(curl -sS -o /tmp/versions -w '%{http_code}' "${AUTH[@]}" -H "Accept: application/json" "$API/project/$P/versions")
            if [ "$vcode" != "200" ]; then
              echo "[$P] GET /project/$P/versions -> HTTP $vcode"
              head -c 300 /tmp/versions; echo ""
              exit 1
            fi

            if [ "$(jq -r --arg V "$VERSION" 'any(.name == $V)' /tmp/versions)" = "true" ]; then
              echo "[$P] fix version '$VERSION' already exists"
              continue
            fi

            BODY=$(jq -n --arg n "$VERSION" --argjson pid "$PID" '{name:$n, projectId:$pid, released:false}')
            ccode=$(curl -sS -o /tmp/created -w '%{http_code}' "${AUTH[@]}" -X POST \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              -d "$BODY" "$API/version")
            if [ "$ccode" != "201" ] && [ "$ccode" != "200" ]; then
              echo "[$P] POST /version -> HTTP $ccode (needs 'Administer Projects' to create versions)"
              head -c 300 /tmp/created; echo ""
              exit 1
            fi
            echo "[$P] created fix version '$VERSION'"
          done

      - name: Add fix version to issues
        if: ${{ !inputs.dry_run && steps.keys.outputs.keys != '' }}
        env:
          JIRA_CLOUD_ID: ${{ secrets.RELEASE_JIRA_CLOUD_ID }}
          JIRA_TOKEN: ${{ secrets.RELEASE_JIRA_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          KEYS: ${{ steps.keys.outputs.keys }}
        run: |
          API="https://api.atlassian.com/ex/jira/$JIRA_CLOUD_ID/rest/api/3"
          AUTH=(-H "Authorization: Bearer $JIRA_TOKEN")

          BODY=$(jq -n --arg v "$VERSION" '{update:{fixVersions:[{add:{name:$v}}]}}')
          FAILED=0
          for KEY in $KEYS; do
            CODE=$(curl -sS -o /tmp/put -w '%{http_code}' "${AUTH[@]}" -X PUT \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              -d "$BODY" "$API/issue/$KEY")
            case "$CODE" in
              204)
                echo "tagged $KEY -> $VERSION"
                ;;
              404)
                # Issue doesn't exist (a placeholder like DP-0000) skip, don't fail.
                echo "WARNING: $KEY not found in Jira skipping (placeholder/mock reference?)"
                ;;
              *)
                echo "ERROR: failed to tag $KEY (HTTP $CODE): $(head -c 200 /tmp/put)"
                FAILED=1
                ;;
            esac
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more issues could not be tagged."
            exit 1
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN no changes made."
          echo "Would set fix version '${{ steps.ver.outputs.version }}' on: ${{ steps.keys.outputs.keys || '(no issues found)' }}"