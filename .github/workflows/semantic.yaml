name: Semantic Workflow

on:
  workflow_call:
    inputs:
      chart_path:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: ""

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_CHANNEL: ${{ secrets.GITHUBACTIONS_SLACK_CHANNEL }}
  NODE_VERSION: 24

jobs:
  semantic:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions: write-all

    steps:

      - name: Generate GitHub App token
        id: gh-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPLOY_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: HDRUK
          repositories: |
            ${{ github.event.repository.name }}

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          token:  ${{ steps.gh-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.gh-token.outputs.token }}

      - name: Set Git config
        run: |
            git config --local user.email "actions@github.com"
            git config --local user.name "Github Actions"
 
      - name: Fetch latest changes from main
        run: |
          git fetch origin main
          git reset --hard origin/main
 
      - name: Read version from Helm chart
        id: getversion
        run: |
          VERSION=$(awk -F'"' '/^appVersion:/ {print $2}' ${{ inputs.chart_path }})
          echo "version=$VERSION" >> $GITHUB_OUTPUT
 
      # Merge main back into dev  and if the merge conflicts push main to a sync branch and open a PR into dev for manual resolution.
      # continue-on-error so a failed dev sync never blocks the release image builds.
      - name: Merge changes from main to dev
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          RELEASE_VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          git fetch origin dev
          git checkout dev

          if git merge --no-ff origin/main -m "sync: merge main into dev after release ${RELEASE_VERSION}"; then
            git push origin dev
            exit 0
          fi

          git merge --abort
          SYNC_BRANCH="sync/main-to-dev-${RELEASE_VERSION}"
          git push --force origin "origin/main:refs/heads/${SYNC_BRANCH}"

          if [ -z "$(gh pr list --base dev --head "${SYNC_BRANCH}" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base dev \
              --head "${SYNC_BRANCH}" \
              --title "chore(GAT-1234): sync main into dev after release ${RELEASE_VERSION}" \
              --body "The automatic main to dev sync after release ${RELEASE_VERSION} hit merge conflicts. Resolve the conflicts in this PR, keeping dev's changes and applying main's hotfix changes."
          fi

          echo "::warning title=main to dev sync needs manual merge::Conflicts merging main into dev; opened PR from ${SYNC_BRANCH}"
