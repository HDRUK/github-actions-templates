name: SBOM script tests

on:
  pull_request:
    paths:
      - 'scripts/sbom/**'
      - '.github/actions/sbom-*/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        working-directory: scripts/sbom
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
