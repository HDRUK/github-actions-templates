name: Docker Build Workflow 
on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: string
      docker_build_args:
        description: "Docker build args"
        required: false
        type: string
      chart_path:
        required: true
        type: string
      download_models:
        required: false
        type: boolean
        default: false

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_CHANNEL: ${{ secrets.GITHUBACTIONS_SLACK_CHANNEL }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: ${{ inputs.environment }}

    outputs:
      image_digest_uri: ${{ steps.digest.outputs.image_digest_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update to latest branch 
        run: |
          BRANCH=${GITHUB_REF_NAME}
          git fetch origin ${BRANCH}
          git checkout ${BRANCH}
          git reset --hard origin/${BRANCH}

      - name: Read version
        id: getversion
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          echo "Current branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == release/* ]]; then
            # Extract version from release branch name
            VERSION="${BRANCH_NAME#release/}"
            VERSION="${VERSION#v}"   # strip leading v if present
            echo "Detected release branch. Version: $VERSION"
          else
            # Extract version from Helm chart
            VERSION=$(awk -F'"' '/^appVersion:/ {print $2}' "${{ inputs.chart_path }}")
            echo "Detected non-release branch. Version from chart: $VERSION"
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: Version could not be determined"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Google Auth (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: inputs.download_models
        uses: google-github-actions/setup-gcloud@v2

      - name: Download models
        if: inputs.download_models
        run: gsutil -m cp -r '${{ secrets.BUCKET_PATH }}' .

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.PROJECT_ID }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Generate GitHub App token
        id: generate-deployment-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPLOY_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: HDRUK
          repositories: |
            ${{ github.event.repository.name }}

      - name: Build & Push Image
        env:
          VERSION: ${{ steps.getversion.outputs.version }}
          GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          GAR_NAME: ${{ secrets.GAR_NAME }}
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_KEYCLOAK_TEST_PASSWORD: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_TEST_PASSWORD }}
          IDVT_SUPPLIER_API_KEY: ${{ secrets.IDVT_SUPPLIER_API_KEY }}
          NEXT_PUBLIC_KEYCLOAK_CLIENT_SECRET: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ steps.generate-deployment-token.outputs.token }}
        run: |
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_NAME}/${VERSION}"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" ${{ inputs.docker_build_args }} ./
          docker push --all-tags '${{ env.GAR_LOCATION }}'-docker.pkg.dev/'${{ env.PROJECT_ID }}'/'${{ env.GAR_NAME }}'/${{ steps.getversion.outputs.version }}

      # Only needed by the SBOM job; skipped entirely unless SBOM is enabled.
      - name: Resolve pushed image digest
        id: digest
        if: vars.SBOM_ENABLED == 'true'
        env:
          IMAGE: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ secrets.GAR_NAME }}/${{ steps.getversion.outputs.version }}
        run: |
          REF="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")"
          echo "image_digest_uri=${REF}" >> "$GITHUB_OUTPUT"

      - name: Run Notification
        id: runnotificationsent
        uses: act10ns/slack@v1
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: ${{ env.SLACK_CHANNEL }}
          message: Deploying {{ env.GITHUB_REF_NAME }} branch to DEV ${{ job.status }}
        if: always()

  # ---------------------------------------------------------------------------
  # SBOM generation and CVE scanning (see docs/ARCHITECTURE/sbom-pipeline.md).
  # Off unless the SBOM_ENABLED variable is "true" for the calling repository.
  # Findings never fail a build; tool or upload errors do.
  # ---------------------------------------------------------------------------
  sbom-app:
    name: SBOM (application layer)
    if: vars.SBOM_ENABLED == 'true' && !startsWith(github.event_name, 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: SBOM gate
        id: gate
        uses: HDRUK/github-actions-templates/.github/actions/sbom-gate@main
        with:
          sbom_enabled: ${{ vars.SBOM_ENABLED }}
          sbom_app_enabled: ${{ vars.SBOM_APP_ENABLED }}
          sbom_container_enabled: ${{ vars.SBOM_CONTAINER_ENABLED }}
          sbom_upload_ar: ${{ vars.SBOM_UPLOAD_AR }}

      - name: Checkout repository
        if: steps.gate.outputs.run_app == 'true'
        uses: actions/checkout@v7

      - name: Google Auth (WIF)
        if: steps.gate.outputs.run_app == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.SBOM_GCP_WIF_PROVIDER || secrets.WIF_PROVIDER }}
          service_account: ${{ vars.SBOM_GCP_SERVICE_ACCOUNT || secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.gate.outputs.run_app == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Application SBOM
        if: steps.gate.outputs.run_app == 'true'
        uses: HDRUK/github-actions-templates/.github/actions/sbom-app@main
        with:
          bucket: ${{ vars.SBOM_BUCKET }}
          composer_auth: ${{ secrets.COMPOSER_AUTH }}
          exclude: ${{ vars.SBOM_EXCLUDES || './node_modules ./tests/fixtures' }}

  sbom-container:
    name: SBOM (container layer)
    needs: build
    if: vars.SBOM_ENABLED == 'true' && !startsWith(github.event_name, 'pull_request') && needs.build.outputs.image_digest_uri != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: SBOM gate
        id: gate
        uses: HDRUK/github-actions-templates/.github/actions/sbom-gate@main
        with:
          sbom_enabled: ${{ vars.SBOM_ENABLED }}
          sbom_app_enabled: ${{ vars.SBOM_APP_ENABLED }}
          sbom_container_enabled: ${{ vars.SBOM_CONTAINER_ENABLED }}
          sbom_upload_ar: ${{ vars.SBOM_UPLOAD_AR }}

      - name: Checkout repository
        if: steps.gate.outputs.run_container == 'true'
        uses: actions/checkout@v7

      - name: Google Auth (WIF)
        if: steps.gate.outputs.run_container == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.SBOM_GCP_WIF_PROVIDER || secrets.WIF_PROVIDER }}
          service_account: ${{ vars.SBOM_GCP_SERVICE_ACCOUNT || secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.gate.outputs.run_container == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to GAR
        if: steps.gate.outputs.run_container == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Container SBOM
        if: steps.gate.outputs.run_container == 'true'
        uses: HDRUK/github-actions-templates/.github/actions/sbom-container@main
        with:
          bucket: ${{ vars.SBOM_BUCKET }}
          image_digest_uri: ${{ needs.build.outputs.image_digest_uri }}
          upload_ar: ${{ steps.gate.outputs.upload_ar }}
