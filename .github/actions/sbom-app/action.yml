name: SBOM (application layer)
description: >
  Generate a CycloneDX SBOM of application dependencies (lockfiles), scan it with
  Grype, write a report-only job summary and upload to the central GCS bucket.
  Findings never fail the step; tool and upload errors do.

inputs:
  bucket:
    description: Central SBOM bucket name
    required: true
  composer_auth:
    description: COMPOSER_AUTH JSON, only needed for PHP repos with private packages
    required: false
    default: ''
  exclude:
    description: Space separated glob patterns for Syft to exclude
    required: false
    default: './node_modules ./tests/fixtures'
  syft_version:
    required: false
    default: '1.51.1'
  grype_version:
    required: false
    default: '0.118.0'

runs:
  using: composite
  steps:
    - name: Install Syft and Grype
      shell: bash
      env:
        SYFT_VERSION: ${{ inputs.syft_version }}
        GRYPE_VERSION: ${{ inputs.grype_version }}
      run: bash "${{ github.action_path }}/../../../scripts/sbom/install_tools.sh"

    - name: Cache Grype database
      uses: actions/cache@v6
      with:
        path: ~/.cache/grype
        key: grype-db-${{ runner.os }}-${{ github.run_id }}
        restore-keys: grype-db-${{ runner.os }}-

    # Syft reads only production packages from composer.lock, so install first and
    # let it read vendor/composer/installed.json (dev dependencies included).
    - name: Resolve PHP dependencies
      shell: bash
      env:
        COMPOSER_AUTH: ${{ inputs.composer_auth }}
      run: |
        if [ -f composer.lock ] && command -v composer >/dev/null 2>&1; then
          composer install --no-scripts --no-progress --ignore-platform-reqs
        fi

    - name: Generate app SBOM and scan
      id: gen
      shell: bash
      env:
        REPO: ${{ github.repository }}
        REF: ${{ github.ref }}
        SHA: ${{ github.sha }}
        BUCKET: ${{ inputs.bucket }}
        EXCLUDES: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        S="${{ github.action_path }}/../../../scripts/sbom"
        python3 "$S/cli.py" paths --bucket "$BUCKET" --repo "$REPO" --layer app --ref "$REF" --sha "$SHA" | tee paths.out >> "$GITHUB_OUTPUT"
        LATEST="$(sed -n 's/^latest=//p' paths.out)"; rm -f paths.out
        mkdir -p sbom
        args=()
        for e in $EXCLUDES; do args+=(--exclude "$e"); done
        syft scan dir:. "${args[@]}" --source-name "${REPO#*/}" --source-version "$SHA" \
          -o "cyclonedx-json=sbom/app.cdx.json"
        python3 "$S/cli.py" annotate sbom/app.cdx.json --layer app
        grype "sbom:sbom/app.cdx.json" -o json > sbom/app.grype.json
        python3 "$S/cli.py" report sbom/app.grype.json --repo "$REPO" --layer app \
          --ref "$REF" --sha "$SHA" --sbom-uri "$LATEST"

    - name: Upload to GCS
      shell: bash
      env:
        LATEST: ${{ steps.gen.outputs.latest }}
        HISTORY: ${{ steps.gen.outputs.history }}
        RELEASE: ${{ steps.gen.outputs.release }}
        META: repo=${{ github.repository }},layer=app,ref=${{ github.ref_name }},sha=${{ github.sha }},run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        for dest in "$LATEST" "$HISTORY" "$RELEASE"; do
          [ -n "$dest" ] && gcloud storage cp sbom/app.cdx.json "$dest" --custom-metadata="$META"
        done
        exit 0
